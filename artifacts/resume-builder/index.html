<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Builder</title>
  <meta name="description" content="Build and download your professional resume instantly." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-2: #f8f9fc;
      --border: #e2e6ef;
      --border-focus: #4f6ef7;
      --text: #1a1d2e;
      --text-muted: #6b7280;
      --accent: #4f6ef7;
      --accent-light: #eef0fe;
      --accent-dark: #3752d4;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --success: #22c55e;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
      --transition: 0.18s ease;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ─── TOP BAR ─────────────────────────────────────────────────────── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      color: var(--accent);
    }
    .topbar-brand svg { flex-shrink: 0; }
    .topbar-actions { display: flex; gap: 10px; align-items: center; }

    /* ─── BUTTONS ─────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500; cursor: pointer;
      border: none; transition: var(--transition); font-family: inherit;
      text-decoration: none; white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent); color: #fff;
    }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-ghost {
      background: transparent; color: var(--text-muted); border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
    .btn-danger-ghost {
      background: transparent; color: var(--danger); border: 1px solid transparent;
      padding: 4px 10px; font-size: 12px;
    }
    .btn-danger-ghost:hover { background: var(--danger-light); border-color: var(--danger); }
    .btn-add {
      background: var(--accent-light); color: var(--accent); border: 1.5px dashed #b0bcf7;
      width: 100%; margin-top: 8px; justify-content: center; padding: 9px;
      border-radius: var(--radius-sm); font-size: 13px;
    }
    .btn-add:hover { background: #dde3fd; border-color: var(--accent); }

    /* ─── LAYOUT ──────────────────────────────────────────────────────── */
    .app-layout {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 0;
      height: calc(100vh - 56px);
    }

    /* ─── FORM PANEL ──────────────────────────────────────────────────── */
    .form-panel {
      overflow-y: auto;
      background: var(--bg);
      padding: 20px;
      border-right: 1px solid var(--border);
    }
    .form-panel::-webkit-scrollbar { width: 5px; }
    .form-panel::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    /* ─── CARD / SECTION ──────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .section-header {
      display: flex; align-items: center; gap: 8px;
      font-weight: 600; font-size: 13px; color: var(--text);
      margin-bottom: 14px; text-transform: uppercase; letter-spacing: .04em;
    }
    .section-header .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0;
    }

    /* ─── FORM FIELDS ─────────────────────────────────────────────────── */
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-row.full { grid-template-columns: 1fr; }
    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .form-group:last-child { margin-bottom: 0; }
    label { font-size: 12px; font-weight: 500; color: var(--text-muted); }
    input, textarea {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      width: 100%;
    }
    input:focus, textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(79,110,247,.12);
      background: #fff;
    }
    textarea { resize: vertical; min-height: 72px; }
    .skills-input-row { display: flex; gap: 8px; }
    .skills-input-row input { flex: 1; }

    /* ─── ENTRY CARD (education / experience) ─────────────────────────── */
    .entry-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 10px;
      background: var(--surface-2);
      position: relative;
    }
    .entry-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .entry-label {
      font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .04em;
    }

    /* ─── SKILLS TAGS ─────────────────────────────────────────────────── */
    .skills-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
    .skill-tag {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--accent-light); color: var(--accent);
      border: 1px solid #c7d0fa; border-radius: 20px;
      padding: 3px 10px 3px 12px; font-size: 12px; font-weight: 500;
    }
    .skill-tag button {
      background: none; border: none; cursor: pointer;
      color: var(--accent); font-size: 14px; line-height: 1; padding: 0;
      display: flex; align-items: center;
    }
    .skill-tag button:hover { color: var(--danger); }

    /* ─── PREVIEW PANEL ───────────────────────────────────────────────── */
    .preview-panel {
      overflow-y: auto;
      background: #e8ecf5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px;
    }
    .preview-panel::-webkit-scrollbar { width: 5px; }
    .preview-panel::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .preview-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-muted); margin-bottom: 16px; align-self: flex-start;
    }

    /* ─── RESUME DOCUMENT ─────────────────────────────────────────────── */
    #resume-doc {
      width: 680px;
      min-height: 960px;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 4px 32px rgba(0,0,0,.14);
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: #1a1d2e;
    }

    .resume-header {
      background: #1e2545;
      color: #fff;
      padding: 32px 40px 28px;
    }
    .resume-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -.01em;
      line-height: 1.1;
      margin-bottom: 6px;
    }
    .resume-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 12px;
    }
    .resume-contact-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: rgba(255,255,255,.8);
    }
    .resume-contact-item svg { opacity: .7; flex-shrink: 0; }

    .resume-body {
      display: grid;
      grid-template-columns: 200px 1fr;
      min-height: 700px;
    }
    .resume-sidebar {
      background: #f4f6fb;
      padding: 28px 22px;
      border-right: 1px solid #e2e6ef;
    }
    .resume-main {
      padding: 28px 32px;
    }

    .resume-section { margin-bottom: 24px; }
    .resume-section:last-child { margin-bottom: 0; }

    .resume-section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--accent);
      padding-bottom: 6px;
      border-bottom: 2px solid var(--accent);
      margin-bottom: 12px;
    }

    .resume-skill-tag {
      display: inline-block;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 500;
      margin: 3px 3px 3px 0;
    }

    .resume-entry { margin-bottom: 16px; }
    .resume-entry:last-child { margin-bottom: 0; }
    .resume-entry-title {
      font-size: 14px; font-weight: 600; color: #1a1d2e;
    }
    .resume-entry-sub {
      font-size: 12px; font-weight: 500; color: var(--accent); margin-top: 1px;
    }
    .resume-entry-dates {
      font-size: 11px; color: var(--text-muted); margin-top: 2px;
    }
    .resume-entry-desc {
      font-size: 12px; color: #444; margin-top: 6px; line-height: 1.6;
    }

    .placeholder-text {
      font-size: 13px; color: #aab; font-style: italic;
    }

    /* ─── EMPTY STATES ────────────────────────────────────────────────── */
    .empty-section { color: #bbb; font-size: 12px; font-style: italic; }

    /* ─── RESPONSIVE ──────────────────────────────────────────────────── */
    @media (max-width: 960px) {
      .app-layout { grid-template-columns: 1fr; height: auto; }
      .preview-panel { display: none; }
      .topbar-preview-btn { display: inline-flex !important; }
      .mobile-preview-overlay {
        display: flex;
        position: fixed; inset: 0; z-index: 200;
        background: #e8ecf5;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        overflow-y: auto;
      }
      .mobile-preview-overlay.hidden { display: none; }
      #resume-doc { width: 100%; max-width: 680px; }
      .resume-body { grid-template-columns: 1fr; }
      .resume-sidebar { border-right: none; border-bottom: 1px solid #e2e6ef; }
    }

    /* ─── PRINT ───────────────────────────────────────────────────────── */
    @media print {
      body > * { display: none !important; }
      #print-area { display: block !important; position: fixed; inset: 0; }
    }
    #print-area { display: none; }

    /* Progress bar at top */
    .progress-bar {
      height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 14px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--accent), #7c3aed);
      border-radius: 2px; transition: width 0.4s ease;
    }
    .progress-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }

    /* Scroll to top for small screens */
    .topbar-preview-btn { display: none; }
    .mobile-close-btn {
      position: fixed; top: 14px; right: 14px; z-index: 300;
      background: #fff; border: 1px solid var(--border);
      border-radius: 50%; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; box-shadow: var(--shadow);
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="topbar-brand">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <rect width="22" height="22" rx="6" fill="#4f6ef7"/>
      <rect x="5" y="6" width="12" height="1.5" rx=".75" fill="white"/>
      <rect x="5" y="9.5" width="9" height="1.5" rx=".75" fill="white" opacity=".75"/>
      <rect x="5" y="13" width="10" height="1.5" rx=".75" fill="white" opacity=".75"/>
      <rect x="5" y="16.5" width="7" height="1.5" rx=".75" fill="white" opacity=".5"/>
    </svg>
    Resume Builder
  </div>
  <div class="topbar-actions">
    <button class="btn btn-ghost topbar-preview-btn" onclick="toggleMobilePreview()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      Preview
    </button>
    <button class="btn btn-primary" onclick="downloadPDF()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download PDF
    </button>
  </div>
</header>

<!-- MOBILE PREVIEW OVERLAY -->
<div id="mobile-preview" class="mobile-preview-overlay hidden">
  <button class="mobile-close-btn" onclick="toggleMobilePreview()">×</button>
  <div class="preview-label">Resume Preview</div>
  <div id="resume-doc-mobile"></div>
</div>

<!-- APP LAYOUT -->
<div class="app-layout">

  <!-- ─── FORM PANEL ─────────────────────────────── -->
  <aside class="form-panel">

    <!-- Completeness -->
    <div class="card" style="padding:14px 18px;">
      <div class="progress-label">Profile completeness</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>

    <!-- Personal Info -->
    <div class="card">
      <div class="section-header"><span class="dot"></span>Personal Information</div>
      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Jane Doe" oninput="update()">
        </div>
        <div class="form-group">
          <label>Job Title</label>
          <input type="text" id="jobtitle" placeholder="Software Engineer" oninput="update()">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="jane@example.com" oninput="update()">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="phone" placeholder="+1 555 000 0000" oninput="update()">
        </div>
      </div>
      <div class="form-row full">
        <div class="form-group">
          <label>Address</label>
          <input type="text" id="address" placeholder="San Francisco, CA, USA" oninput="update()">
        </div>
      </div>
      <div class="form-row full">
        <div class="form-group" style="margin-bottom:0">
          <label>Professional Summary</label>
          <textarea id="summary" placeholder="A brief, compelling summary of who you are and what you bring to the table..." rows="3" oninput="update()"></textarea>
        </div>
      </div>
    </div>

    <!-- Experience -->
    <div class="card">
      <div class="section-header"><span class="dot"></span>Work Experience</div>
      <div id="exp-list"></div>
      <button class="btn btn-add" onclick="addExperience()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Experience
      </button>
    </div>

    <!-- Education -->
    <div class="card">
      <div class="section-header"><span class="dot"></span>Education</div>
      <div id="edu-list"></div>
      <button class="btn btn-add" onclick="addEducation()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Education
      </button>
    </div>

    <!-- Skills -->
    <div class="card">
      <div class="section-header"><span class="dot"></span>Skills</div>
      <div class="skills-tags" id="skills-tags"></div>
      <div class="skills-input-row">
        <input type="text" id="skill-input" placeholder="e.g. JavaScript, Project Management…" onkeydown="skillKeyDown(event)">
        <button class="btn btn-primary" onclick="addSkill()" style="padding:8px 14px;">Add</button>
      </div>
    </div>

  </aside>

  <!-- ─── PREVIEW PANEL ────────────────────────────── -->
  <section class="preview-panel">
    <div class="preview-label">Live Resume Preview</div>
    <div id="resume-doc">
      <!-- rendered by JS -->
    </div>
  </section>

</div>

<script>
/* ═══════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════ */
let skills = [];
let experiences = [];
let educations = [];
let expCounter = 0;
let eduCounter = 0;

/* ═══════════════════════════════════════════════════
   INIT — add one empty entry for each section
═══════════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  addExperience();
  addEducation();
  update();
});

/* ═══════════════════════════════════════════════════
   EXPERIENCE
═══════════════════════════════════════════════════ */
function addExperience() {
  const id = ++expCounter;
  experiences.push(id);
  const container = document.getElementById('exp-list');
  const div = document.createElement('div');
  div.className = 'entry-card';
  div.id = 'exp-' + id;
  div.innerHTML = `
    <div class="entry-card-header">
      <span class="entry-label">Position ${id}</span>
      <button class="btn btn-danger-ghost" onclick="removeExperience(${id})">Remove</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Job Title</label>
        <input type="text" id="exp-title-${id}" placeholder="Senior Developer" oninput="update()">
      </div>
      <div class="form-group">
        <label>Company</label>
        <input type="text" id="exp-company-${id}" placeholder="Acme Corp" oninput="update()">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Start Date</label>
        <input type="text" id="exp-start-${id}" placeholder="Jan 2021" oninput="update()">
      </div>
      <div class="form-group">
        <label>End Date</label>
        <input type="text" id="exp-end-${id}" placeholder="Present" oninput="update()">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:0">
      <label>Description</label>
      <textarea id="exp-desc-${id}" placeholder="Key responsibilities and achievements..." oninput="update()"></textarea>
    </div>
  `;
  container.appendChild(div);
  update();
}

function removeExperience(id) {
  experiences = experiences.filter(e => e !== id);
  document.getElementById('exp-' + id).remove();
  update();
}

function getExperiences() {
  return experiences.map(id => ({
    title:   val('exp-title-' + id),
    company: val('exp-company-' + id),
    start:   val('exp-start-' + id),
    end:     val('exp-end-' + id),
    desc:    val('exp-desc-' + id),
  }));
}

/* ═══════════════════════════════════════════════════
   EDUCATION
═══════════════════════════════════════════════════ */
function addEducation() {
  const id = ++eduCounter;
  educations.push(id);
  const container = document.getElementById('edu-list');
  const div = document.createElement('div');
  div.className = 'entry-card';
  div.id = 'edu-' + id;
  div.innerHTML = `
    <div class="entry-card-header">
      <span class="entry-label">Degree ${id}</span>
      <button class="btn btn-danger-ghost" onclick="removeEducation(${id})">Remove</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Degree / Certificate</label>
        <input type="text" id="edu-degree-${id}" placeholder="B.S. Computer Science" oninput="update()">
      </div>
      <div class="form-group">
        <label>Institution</label>
        <input type="text" id="edu-school-${id}" placeholder="MIT" oninput="update()">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Graduation Year</label>
        <input type="text" id="edu-year-${id}" placeholder="2020" oninput="update()">
      </div>
      <div class="form-group">
        <label>GPA / Honours</label>
        <input type="text" id="edu-gpa-${id}" placeholder="3.9 / 4.0" oninput="update()">
      </div>
    </div>
  `;
  container.appendChild(div);
  update();
}

function removeEducation(id) {
  educations = educations.filter(e => e !== id);
  document.getElementById('edu-' + id).remove();
  update();
}

function getEducations() {
  return educations.map(id => ({
    degree: val('edu-degree-' + id),
    school: val('edu-school-' + id),
    year:   val('edu-year-' + id),
    gpa:    val('edu-gpa-' + id),
  }));
}

/* ═══════════════════════════════════════════════════
   SKILLS
═══════════════════════════════════════════════════ */
function addSkill() {
  const input = document.getElementById('skill-input');
  const raw = input.value.trim();
  if (!raw) return;
  const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
  parts.forEach(s => { if (s && !skills.includes(s)) skills.push(s); });
  input.value = '';
  renderSkillTags();
  update();
}

function skillKeyDown(e) {
  if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addSkill(); }
}

function removeSkill(idx) {
  skills.splice(idx, 1);
  renderSkillTags();
  update();
}

function renderSkillTags() {
  const container = document.getElementById('skills-tags');
  container.innerHTML = skills.map((s, i) => `
    <span class="skill-tag">
      ${esc(s)}
      <button onclick="removeSkill(${i})" title="Remove">×</button>
    </span>
  `).join('');
}

/* ═══════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════ */
function val(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function nl2br(s) {
  return esc(s).replace(/\n/g, '<br>');
}

/* ═══════════════════════════════════════════════════
   PROGRESS
═══════════════════════════════════════════════════ */
function calcProgress() {
  const fields = ['name','jobtitle','email','phone','address','summary'];
  let filled = fields.filter(f => val(f)).length;
  let total = fields.length;
  if (skills.length > 0) filled += 1; total += 1;
  const exps = getExperiences();
  if (exps.some(e => e.title || e.company)) filled += 1; total += 1;
  const edus = getEducations();
  if (edus.some(e => e.degree || e.school)) filled += 1; total += 1;
  return Math.round((filled / total) * 100);
}

/* ═══════════════════════════════════════════════════
   RENDER RESUME
═══════════════════════════════════════════════════ */
function renderResume() {
  const name     = val('name')     || '<span class="placeholder-text">Your Name</span>';
  const jobtitle = val('jobtitle') || '';
  const email    = val('email')    || '';
  const phone    = val('phone')    || '';
  const address  = val('address')  || '';
  const summary  = val('summary')  || '';

  const exps = getExperiences();
  const edus = getEducations();

  const contactIcons = {
    email: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`,
    phone: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8 19.79 19.79 0 01.22 2.18 2 2 0 012.18 0h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.18 6.18l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>`,
    addr: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  };

  const contactItems = [
    email   ? `<div class="resume-contact-item">${contactIcons.email} ${esc(email)}</div>` : '',
    phone   ? `<div class="resume-contact-item">${contactIcons.phone} ${esc(phone)}</div>` : '',
    address ? `<div class="resume-contact-item">${contactIcons.addr} ${esc(address)}</div>` : '',
  ].filter(Boolean).join('');

  const skillsHTML = skills.length
    ? skills.map(s => `<span class="resume-skill-tag">${esc(s)}</span>`).join('')
    : `<span class="empty-section">No skills added yet</span>`;

  const eduHTML = edus.filter(e => e.degree || e.school).map(e => `
    <div class="resume-entry">
      <div class="resume-entry-title">${esc(e.degree || 'Degree')}</div>
      <div class="resume-entry-sub">${esc(e.school)}</div>
      <div class="resume-entry-dates">
        ${[e.year, e.gpa ? 'GPA: ' + esc(e.gpa) : ''].filter(Boolean).join(' &nbsp;·&nbsp; ')}
      </div>
    </div>
  `).join('') || `<span class="empty-section">No education added yet</span>`;

  const expHTML = exps.filter(e => e.title || e.company).map(e => `
    <div class="resume-entry">
      <div class="resume-entry-title">${esc(e.title || 'Position')}</div>
      <div class="resume-entry-sub">${esc(e.company)}</div>
      <div class="resume-entry-dates">${[e.start, e.end].filter(Boolean).join(' – ')}</div>
      ${e.desc ? `<div class="resume-entry-desc">${nl2br(e.desc)}</div>` : ''}
    </div>
  `).join('') || `<span class="empty-section">No experience added yet</span>`;

  return `
    <div class="resume-header">
      <div class="resume-name">${typeof name === 'string' && name.startsWith('<span') ? name : esc(val('name') || 'Your Name')}</div>
      ${jobtitle ? `<div style="font-size:13px;color:rgba(255,255,255,.7);margin-top:4px;font-weight:400;">${esc(jobtitle)}</div>` : ''}
      ${contactItems ? `<div class="resume-contact">${contactItems}</div>` : ''}
    </div>
    <div class="resume-body">
      <div class="resume-sidebar">
        <div class="resume-section">
          <div class="resume-section-title">Skills</div>
          ${skillsHTML}
        </div>
        <div class="resume-section">
          <div class="resume-section-title">Education</div>
          ${eduHTML}
        </div>
      </div>
      <div class="resume-main">
        ${summary ? `
        <div class="resume-section">
          <div class="resume-section-title">Summary</div>
          <div style="font-size:12.5px;color:#444;line-height:1.7;">${nl2br(summary)}</div>
        </div>` : ''}
        <div class="resume-section">
          <div class="resume-section-title">Work Experience</div>
          ${expHTML}
        </div>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════
   MAIN UPDATE
═══════════════════════════════════════════════════ */
function update() {
  const html = renderResume();
  document.getElementById('resume-doc').innerHTML = html;

  // sync mobile preview if open
  const mob = document.getElementById('resume-doc-mobile');
  if (mob && !document.getElementById('mobile-preview').classList.contains('hidden')) {
    mob.innerHTML = html;
  }

  // progress
  const pct = calcProgress();
  document.getElementById('progress-fill').style.width = pct + '%';
}

/* ═══════════════════════════════════════════════════
   MOBILE PREVIEW TOGGLE
═══════════════════════════════════════════════════ */
function toggleMobilePreview() {
  const overlay = document.getElementById('mobile-preview');
  overlay.classList.toggle('hidden');
  if (!overlay.classList.contains('hidden')) {
    document.getElementById('resume-doc-mobile').innerHTML = renderResume();
  }
}

/* ═══════════════════════════════════════════════════
   DOWNLOAD PDF
═══════════════════════════════════════════════════ */
function downloadPDF() {
  const btn = document.querySelector('.btn-primary');
  btn.textContent = 'Generating…';
  btn.disabled = true;

  const element = document.getElementById('resume-doc');
  const name = val('name') || 'Resume';

  const opt = {
    margin:      0,
    filename:    name.replace(/\s+/g, '_') + '_Resume.pdf',
    image:       { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, logging: false },
    jsPDF:       { unit: 'px', format: [680, 960], orientation: 'portrait', hotfixes: ['px_scaling'] }
  };

  html2pdf().set(opt).from(element).save().then(() => {
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download PDF`;
    btn.disabled = false;
  });
}
</script>
